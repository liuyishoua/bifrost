<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Bifrost 运行架构</title>
  <desc id="desc">浏览器通过 Caddy 访问门户与独立应用。Caddy 向门户检查权限，再将请求转发到各应用进程；门户负责启动和关闭应用。</desc>
  <defs>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1d1d1f; }
      .muted { fill: #6e6e73; }
      .blue { fill: #007aff; }
      .line { fill: none; stroke: #b8c2cf; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .control { fill: none; stroke: #8ca2bc; stroke-width: 2; stroke-dasharray: 6 7; stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#b8c2cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8ca2bc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="28" fill="#f7f8fa"/>
  <text class="text" x="48" y="57" font-size="25" font-weight="650">一个入口，多个独立应用</text>
  <text class="text muted" x="48" y="85" font-size="15">登录与权限在平台，业务运行在各自的进程里</text>

  <path class="line" d="M286 274 H364" marker-end="url(#arrow)"/>
  <path class="line" d="M616 248 H670 V170 H756" marker-end="url(#arrow)"/>
  <path class="line" d="M616 316 H756" marker-end="url(#arrow)"/>
  <path class="control" d="M928 218 V254" marker-end="url(#control-arrow)"/>
  <text class="text muted" x="302" y="252" font-size="13">8080 / 应用端口</text>
  <text class="text muted" x="654" y="153" font-size="13">每次访问验权</text>
  <text class="text muted" x="645" y="303" font-size="13">转发请求</text>
  <text class="text muted" x="944" y="244" font-size="12">启停</text>

  <rect x="48" y="206" width="238" height="136" rx="22" fill="#ffffff" stroke="#e6e8ec"/>
  <circle cx="82" cy="244" r="10" fill="#007aff" opacity=".14"/>
  <circle cx="82" cy="244" r="4" fill="#007aff"/>
  <text class="text" x="103" y="251" font-size="21" font-weight="620">用户浏览器</text>
  <text class="text muted" x="75" y="289" font-size="15">先登录，再点击应用</text>
  <text class="text muted" x="75" y="313" font-size="15">进入应用自己的地址</text>

  <rect x="366" y="206" width="250" height="136" rx="22" fill="#ffffff" stroke="#e6e8ec"/>
  <rect x="392" y="230" width="36" height="36" rx="11" fill="#e8f2ff"/>
  <path d="M401 242 H419 M401 249 H419 M401 256 H413" stroke="#007aff" stroke-width="2" stroke-linecap="round"/>
  <text class="text" x="440" y="255" font-size="21" font-weight="620">Caddy 网关</text>
  <text class="text muted" x="393" y="290" font-size="15">对外接收访问</text>
  <text class="text muted" x="393" y="314" font-size="15">验权后转发给应用</text>

  <rect x="756" y="110" width="396" height="108" rx="22" fill="#ffffff" stroke="#d9e7f8"/>
  <circle cx="789" cy="145" r="10" fill="#007aff" opacity=".14"/>
  <circle cx="789" cy="145" r="4" fill="#007aff"/>
  <text class="text" x="811" y="152" font-size="21" font-weight="620">Bifrost 门户</text>
  <text class="text muted" x="783" y="185" font-size="15">账号 · 应用权限 · 进程开关</text>

  <rect x="756" y="254" width="396" height="198" rx="22" fill="#ffffff" stroke="#e6e8ec"/>
  <text class="text" x="783" y="286" font-size="17" font-weight="620">独立的业务进程</text>
  <line x1="783" y1="301" x2="1125" y2="301" stroke="#eef0f3"/>
  <text class="text" x="783" y="331" font-size="16">Weixin</text>
  <text class="text muted" x="1015" y="331" font-size="14">9000</text>
  <line x1="783" y1="344" x2="1125" y2="344" stroke="#eef0f3"/>
  <text class="text" x="783" y="373" font-size="16">Douyin</text>
  <text class="text muted" x="1015" y="373" font-size="14">9001</text>
  <line x1="783" y1="386" x2="1125" y2="386" stroke="#eef0f3"/>
  <text class="text" x="783" y="415" font-size="16">Ticket</text>
  <text class="text muted" x="1015" y="415" font-size="14">9002</text>
</svg>
